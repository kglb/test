{% extends "base.html" %}

{% block title %}库存记录 - 实验室管理系统{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-history me-2"></i>库存记录</h2>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addRecordModal">
                    <i class="fas fa-plus me-2"></i>新增记录
                </button>
            </div>

            <!-- 筛选器 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label for="typeFilter" class="form-label">记录类型</label>
                            <select class="form-select" id="typeFilter">
                                <option value="">全部类型</option>
                                <option value="in">入库</option>
                                <option value="out">出库</option>
                                <option value="adjust">调整</option>
                                <option value="transfer">转移</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="inventoryFilter" class="form-label">物品名称</label>
                            <input type="text" class="form-control" id="inventoryFilter" placeholder="搜索物品...">
                        </div>
                        <div class="col-md-3">
                            <label for="dateRange" class="form-label">日期范围</label>
                            <input type="date" class="form-control" id="startDate" placeholder="开始日期">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <div class="d-flex gap-2">
                                <input type="date" class="form-control" id="endDate" placeholder="结束日期">
                                <button type="button" class="btn btn-outline-primary" onclick="applyFilters()">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 记录表格 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>时间</th>
                                    <th>物品名称</th>
                                    <th>类型</th>
                                    <th>数量</th>
                                    <th>单价</th>
                                    <th>总价</th>
                                    <th>操作人</th>
                                    <th>备注</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="recordsTableBody">
                                <!-- 数据将通过JavaScript动态加载 -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 分页 -->
                    <nav aria-label="分页导航">
                        <ul class="pagination justify-content-center" id="pagination">
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新增记录模态框 -->
<div class="modal fade" id="addRecordModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增库存记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="recordForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="inventorySelect" class="form-label">选择物品 *</label>
                            <select class="form-select" id="inventorySelect" required>
                                <option value="">请选择物品...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="recordType" class="form-label">记录类型 *</label>
                            <select class="form-select" id="recordType" required>
                                <option value="">请选择类型...</option>
                                <option value="in">入库</option>
                                <option value="out">出库</option>
                                <option value="adjust">调整</option>
                                <option value="transfer">转移</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="quantity" class="form-label">数量 *</label>
                            <input type="number" class="form-control" id="quantity" step="0.1" required>
                        </div>
                        <div class="col-md-6">
                            <label for="unitPrice" class="form-label">单价</label>
                            <input type="number" class="form-control" id="unitPrice" step="0.01">
                        </div>
                        <div class="col-md-6">
                            <label for="batchNumber" class="form-label">批号</label>
                            <input type="text" class="form-control" id="batchNumber">
                        </div>
                        <div class="col-md-6">
                            <label for="supplier" class="form-label">供应商</label>
                            <input type="text" class="form-control" id="supplier">
                        </div>
                        <div class="col-md-6">
                            <label for="expiryDate" class="form-label">过期日期</label>
                            <input type="date" class="form-control" id="expiryDate">
                        </div>
                        <div class="col-md-6">
                            <label for="purpose" class="form-label">用途</label>
                            <input type="text" class="form-control" id="purpose">
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">备注</label>
                            <textarea class="form-control" id="notes" rows="3"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitRecord()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let totalPages = 1;

// 页面加载时初始化
$(document).ready(function() {
    loadInventoryOptions();
    loadRecords();
});

// 加载库存物品选项
function loadInventoryOptions() {
    $.get('/api/inventory', function(data) {
        const select = $('#inventorySelect');
        select.empty().append('<option value="">请选择物品...</option>');
        
        if (data.inventory) {
            data.inventory.forEach(item => {
                select.append(`<option value="${item.id}">${item.name} (${item.current_stock}${item.unit})</option>`);
            });
        }
    });
}

// 加载记录
function loadRecords(page = 1) {
    const params = {
        page: page,
        per_page: 20
    };
    
    // 添加筛选条件
    const typeFilter = $('#typeFilter').val();
    if (typeFilter) params.record_type = typeFilter;
    
    const startDate = $('#startDate').val();
    if (startDate) params.start_date = startDate;
    
    const endDate = $('#endDate').val();
    if (endDate) params.end_date = endDate;
    
    $.get('/api/inventory/records', params, function(data) {
        updateRecordsTable(data.records);
        updatePagination(data.current_page, data.pages, data.total);
        currentPage = data.current_page;
        totalPages = data.pages;
    }).fail(function() {
        showAlert('加载记录失败', 'error');
    });
}

// 更新记录表格
function updateRecordsTable(records) {
    const tbody = $('#recordsTableBody');
    tbody.empty();
    
    if (records.length === 0) {
        tbody.append(`
            <tr>
                <td colspan="9" class="text-center text-muted">暂无记录</td>
            </tr>
        `);
        return;
    }
    
    records.forEach(record => {
        const typeLabels = {
            'in': '<span class="badge bg-success">入库</span>',
            'out': '<span class="badge bg-warning">出库</span>',
            'adjust': '<span class="badge bg-info">调整</span>',
            'transfer': '<span class="badge bg-secondary">转移</span>'
        };
        
        const quantity = record.record_type === 'out' ? `-${record.quantity}` : record.quantity;
        const unitPrice = record.unit_price ? `¥${record.unit_price.toFixed(2)}` : '-';
        const totalPrice = record.total_price ? `¥${record.total_price.toFixed(2)}` : '-';
        
        tbody.append(`
            <tr>
                <td>${new Date(record.created_at).toLocaleString()}</td>
                <td>${record.inventory_name}</td>
                <td>${typeLabels[record.record_type] || record.record_type}</td>
                <td>${quantity}</td>
                <td>${unitPrice}</td>
                <td>${totalPrice}</td>
                <td>${record.operator_name}</td>
                <td>${record.notes || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-info" onclick="viewRecord(${record.id})">
                        <i class="fas fa-eye"></i>
                    </button>
                </td>
            </tr>
        `);
    });
}

// 更新分页
function updatePagination(current, total, count) {
    const pagination = $('#pagination');
    pagination.empty();
    
    if (total <= 1) return;
    
    // 上一页
    pagination.append(`
        <li class="page-item ${current === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadRecords(${current - 1})">上一页</a>
        </li>
    `);
    
    // 页码
    for (let i = Math.max(1, current - 2); i <= Math.min(total, current + 2); i++) {
        pagination.append(`
            <li class="page-item ${i === current ? 'active' : ''}">
                <a class="page-link" href="#" onclick="loadRecords(${i})">${i}</a>
            </li>
        `);
    }
    
    // 下一页
    pagination.append(`
        <li class="page-item ${current === total ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadRecords(${current + 1})">下一页</a>
        </li>
    `);
}

// 应用筛选
function applyFilters() {
    loadRecords(1);
}

// 提交记录
function submitRecord() {
    const formData = {
        inventory_id: $('#inventorySelect').val(),
        record_type: $('#recordType').val(),
        quantity: parseFloat($('#quantity').val()),
        unit_price: $('#unitPrice').val() ? parseFloat($('#unitPrice').val()) : null,
        batch_number: $('#batchNumber').val(),
        supplier: $('#supplier').val(),
        expiry_date: $('#expiryDate').val() || null,
        purpose: $('#purpose').val(),
        notes: $('#notes').val()
    };
    
    // 计算总价
    if (formData.unit_price && formData.quantity) {
        formData.total_price = formData.unit_price * formData.quantity;
    }
    
    // 验证必填字段
    if (!formData.inventory_id || !formData.record_type || !formData.quantity) {
        showAlert('请填写必填字段', 'error');
        return;
    }
    
    $.ajax({
        url: '/api/inventory/records',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify(formData),
        success: function(data) {
            showAlert('记录添加成功', 'success');
            $('#addRecordModal').modal('hide');
            $('#recordForm')[0].reset();
            loadRecords(currentPage);
            loadInventoryOptions(); // 更新库存数量显示
        },
        error: function(xhr) {
            const error = xhr.responseJSON?.error || '添加失败';
            showAlert(error, 'error');
        }
    });
}

// 查看记录详情
function viewRecord(recordId) {
    // 这里可以实现记录详情查看功能
    showAlert('记录详情功能待实现', 'info');
}

// 显示提示信息
function showAlert(message, type) {
    const alertClass = type === 'error' ? 'alert-danger' : 
                      type === 'success' ? 'alert-success' : 
                      type === 'warning' ? 'alert-warning' : 'alert-info';
    
    const alert = $(`
        <div class="alert ${alertClass} alert-dismissible fade show" role="alert">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `);
    
    $('.container-fluid').prepend(alert);
    
    // 3秒后自动关闭
    setTimeout(() => {
        alert.alert('close');
    }, 3000);
}
</script>
{% endblock %}
