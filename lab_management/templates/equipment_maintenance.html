{% extends "base.html" %}

{% block title %}设备维护{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fas fa-tools"></i> 设备维护</h2>
                <div>
                    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addMaintenanceModal">
                        <i class="fas fa-plus"></i> 添加维护记录
                    </button>
                    <a href="/equipment" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> 返回设备管理
                    </a>
                </div>
            </div>

            <!-- 筛选条件 -->
            <div class="card mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <label for="equipmentFilter" class="form-label">选择设备</label>
                            <select class="form-select" id="equipmentFilter">
                                <option value="">全部设备</option>
                                <!-- 设备选项将动态加载 -->
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="typeFilter" class="form-label">维护类型</label>
                            <select class="form-select" id="typeFilter">
                                <option value="">全部类型</option>
                                <option value="routine">例行维护</option>
                                <option value="repair">故障维修</option>
                                <option value="calibration">校准</option>
                                <option value="upgrade">升级</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="statusFilter" class="form-label">维护状态</label>
                            <select class="form-select" id="statusFilter">
                                <option value="">全部状态</option>
                                <option value="scheduled">已计划</option>
                                <option value="in_progress">进行中</option>
                                <option value="completed">已完成</option>
                                <option value="cancelled">已取消</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <div>
                                <button class="btn btn-primary w-100" onclick="searchMaintenanceRecords()">
                                    <i class="fas fa-search"></i> 搜索
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 维护提醒 -->
            <div class="card mb-4" id="maintenanceAlerts">
                <!-- 维护提醒将在这里动态加载 -->
            </div>

            <!-- 维护记录列表 -->
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>设备名称</th>
                                    <th>维护类型</th>
                                    <th>描述</th>
                                    <th>执行人</th>
                                    <th>开始日期</th>
                                    <th>结束日期</th>
                                    <th>费用</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="maintenanceTableBody">
                                <!-- 维护记录将在这里动态加载 -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- 分页 -->
                    <nav aria-label="维护记录分页">
                        <ul class="pagination justify-content-center" id="maintenancePagination">
                            <!-- 分页按钮将在这里动态生成 -->
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 添加维护记录模态框 -->
<div class="modal fade" id="addMaintenanceModal" tabindex="-1" aria-labelledby="addMaintenanceModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addMaintenanceModalLabel">添加维护记录</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="maintenanceForm">
                    <div class="mb-3">
                        <label for="maintenanceEquipment" class="form-label">选择设备 *</label>
                        <select class="form-select" id="maintenanceEquipment" required>
                            <option value="">请选择设备</option>
                            <!-- 设备选项将动态加载 -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="maintenanceType" class="form-label">维护类型 *</label>
                        <select class="form-select" id="maintenanceType" required>
                            <option value="">请选择类型</option>
                            <option value="routine">例行维护</option>
                            <option value="repair">故障维修</option>
                            <option value="calibration">校准</option>
                            <option value="upgrade">升级</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="maintenanceDescription" class="form-label">维护描述 *</label>
                        <textarea class="form-control" id="maintenanceDescription" rows="3" required placeholder="请详细描述维护内容"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="maintenanceStartDate" class="form-label">开始日期 *</label>
                                <input type="date" class="form-control" id="maintenanceStartDate" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="maintenanceEndDate" class="form-label">结束日期</label>
                                <input type="date" class="form-control" id="maintenanceEndDate">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="maintenanceCost" class="form-label">维护费用（元）</label>
                                <input type="number" class="form-control" id="maintenanceCost" step="0.01" placeholder="0.00">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="maintenanceStatus" class="form-label">维护状态</label>
                                <select class="form-select" id="maintenanceStatus">
                                    <option value="scheduled">已计划</option>
                                    <option value="in_progress">进行中</option>
                                    <option value="completed">已完成</option>
                                    <option value="cancelled">已取消</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="maintenanceNotes" class="form-label">维护备注</label>
                        <textarea class="form-control" id="maintenanceNotes" rows="3" placeholder="维护过程中的注意事项、问题等"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveMaintenance()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 维护详情模态框 -->
<div class="modal fade" id="maintenanceDetailModal" tabindex="-1" aria-labelledby="maintenanceDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="maintenanceDetailModalLabel">维护记录详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="maintenanceDetailContent">
                <!-- 维护详情内容将在这里动态加载 -->
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentFilters = {};

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
    loadMaintenanceRecords();
    loadEquipmentOptions();
    loadMaintenanceAlerts();
    
    // 设置默认开始日期为今天
    document.getElementById('maintenanceStartDate').value = new Date().toISOString().split('T')[0];
});

// 加载维护记录
function loadMaintenanceRecords(page = 1) {
    currentPage = page;
    
    const params = new URLSearchParams({
        page: page,
        per_page: 10,
        ...currentFilters
    });
    
    fetch(`/api/equipment/maintenance?${params}`)
        .then(response => response.json())
        .then(data => {
            displayMaintenanceRecords(data.maintenance_records);
            displayPagination(data.total, data.pages, page);
        })
        .catch(error => {
            console.error('Error:', error);
            showAlert('加载维护记录失败', 'danger');
        });
}

// 显示维护记录
function displayMaintenanceRecords(records) {
    const tbody = document.getElementById('maintenanceTableBody');
    tbody.innerHTML = '';
    
    records.forEach(record => {
        const statusBadge = getMaintenanceStatusBadge(record.status);
        const typeBadge = getMaintenanceTypeBadge(record.maintenance_type);
        
        const row = `
            <tr>
                <td>
                    <strong>${record.equipment_name}</strong>
                </td>
                <td>${typeBadge}</td>
                <td>${record.description.substring(0, 50)}${record.description.length > 50 ? '...' : ''}</td>
                <td>${record.performed_by_name}</td>
                <td>${record.start_date || '-'}</td>
                <td>${record.end_date || '-'}</td>
                <td>${record.cost ? '¥' + record.cost : '-'}</td>
                <td>${statusBadge}</td>
                <td>
                    <div class="btn-group" role="group">
                        <button class="btn btn-sm btn-outline-primary" onclick="viewMaintenanceDetail(${record.id})" title="查看详情">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-warning" onclick="editMaintenance(${record.id})" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                    </div>
                </td>
            </tr>
        `;
        tbody.innerHTML += row;
    });
}

// 获取维护状态标签
function getMaintenanceStatusBadge(status) {
    const statusMap = {
        'scheduled': '<span class="badge bg-info">已计划</span>',
        'in_progress': '<span class="badge bg-warning">进行中</span>',
        'completed': '<span class="badge bg-success">已完成</span>',
        'cancelled': '<span class="badge bg-secondary">已取消</span>'
    };
    return statusMap[status] || `<span class="badge bg-secondary">${status}</span>`;
}

// 获取维护类型标签
function getMaintenanceTypeBadge(type) {
    const typeMap = {
        'routine': '<span class="badge bg-primary">例行维护</span>',
        'repair': '<span class="badge bg-danger">故障维修</span>',
        'calibration': '<span class="badge bg-info">校准</span>',
        'upgrade': '<span class="badge bg-success">升级</span>'
    };
    return typeMap[type] || `<span class="badge bg-secondary">${type}</span>`;
}

// 搜索维护记录
function searchMaintenanceRecords() {
    currentFilters = {
        equipment_id: document.getElementById('equipmentFilter').value,
        maintenance_type: document.getElementById('typeFilter').value,
        status: document.getElementById('statusFilter').value
    };
    loadMaintenanceRecords(1);
}

// 加载设备选项
function loadEquipmentOptions() {
    fetch('/api/equipment')
        .then(response => response.json())
        .then(data => {
            const filterSelect = document.getElementById('equipmentFilter');
            const maintenanceSelect = document.getElementById('maintenanceEquipment');
            
            filterSelect.innerHTML = '<option value="">全部设备</option>';
            maintenanceSelect.innerHTML = '<option value="">请选择设备</option>';
            
            data.equipment.forEach(equipment => {
                filterSelect.innerHTML += `<option value="${equipment.id}">${equipment.name} (${equipment.serial_number})</option>`;
                maintenanceSelect.innerHTML += `<option value="${equipment.id}">${equipment.name} (${equipment.serial_number})</option>`;
            });
        })
        .catch(error => console.error('Error loading equipment:', error));
}

// 加载维护提醒
function loadMaintenanceAlerts() {
    fetch('/api/equipment/statistics')
        .then(response => response.json())
        .then(data => {
            const alertsContainer = document.getElementById('maintenanceAlerts');
            
            if (data.overdue_maintenance > 0) {
                alertsContainer.innerHTML = `
                    <div class="alert alert-warning" role="alert">
                        <i class="fas fa-exclamation-triangle"></i>
                        <strong>维护提醒:</strong> 有 ${data.overdue_maintenance} 台设备需要进行维护，请及时安排！
                    </div>
                `;
            } else {
                alertsContainer.innerHTML = `
                    <div class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i>
                        所有设备维护状态正常
                    </div>
                `;
            }
        })
        .catch(error => console.error('Error loading maintenance alerts:', error));
}

// 保存维护记录
function saveMaintenance() {
    const form = document.getElementById('maintenanceForm');
    
    const data = {
        equipment_id: document.getElementById('maintenanceEquipment').value,
        maintenance_type: document.getElementById('maintenanceType').value,
        description: document.getElementById('maintenanceDescription').value,
        start_date: document.getElementById('maintenanceStartDate').value,
        end_date: document.getElementById('maintenanceEndDate').value || null,
        cost: document.getElementById('maintenanceCost').value || null,
        status: document.getElementById('maintenanceStatus').value,
        notes: document.getElementById('maintenanceNotes').value
    };
    
    fetch('/api/equipment/maintenance', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showAlert('维护记录创建成功', 'success');
            bootstrap.Modal.getInstance(document.getElementById('addMaintenanceModal')).hide();
            loadMaintenanceRecords(currentPage);
            loadMaintenanceAlerts(); // 重新加载提醒
            form.reset();
            // 重置开始日期为今天
            document.getElementById('maintenanceStartDate').value = new Date().toISOString().split('T')[0];
        } else {
            showAlert(data.error || '操作失败', 'danger');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        showAlert('操作失败', 'danger');
    });
}

// 编辑维护记录
function editMaintenance(maintenanceId) {
    // 这里应该实现编辑维护记录的功能
    showAlert('编辑维护记录功能待实现', 'info');
}

// 查看维护详情
function viewMaintenanceDetail(maintenanceId) {
    fetch(`/api/equipment/maintenance?maintenance_id=${maintenanceId}`)
        .then(response => response.json())
        .then(data => {
            const maintenance = data.maintenance_records[0];
            if (maintenance) {
                const detailContent = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>基本信息</h6>
                            <table class="table table-sm">
                                <tr><th>设备名称:</th><td>${maintenance.equipment_name}</td></tr>
                                <tr><th>维护类型:</th><td>${getMaintenanceTypeBadge(maintenance.maintenance_type)}</td></tr>
                                <tr><th>执行人:</th><td>${maintenance.performed_by_name}</td></tr>
                                <tr><th>状态:</th><td>${getMaintenanceStatusBadge(maintenance.status)}</td></tr>
                                <tr><th>费用:</th><td>${maintenance.cost ? '¥' + maintenance.cost : '-'}</td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>时间信息</h6>
                            <table class="table table-sm">
                                <tr><th>开始日期:</th><td>${maintenance.start_date || '-'}</td></tr>
                                <tr><th>结束日期:</th><td>${maintenance.end_date || '-'}</td></tr>
                                <tr><th>创建时间:</th><td>${maintenance.created_at ? new Date(maintenance.created_at).toLocaleString() : '-'}</td></tr>
                                <tr><th>更新时间:</th><td>${maintenance.updated_at ? new Date(maintenance.updated_at).toLocaleString() : '-'}</td></tr>
                            </table>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <h6>维护描述</h6>
                            <p>${maintenance.description}</p>
                        </div>
                    </div>
                    ${maintenance.notes ? `
                        <div class="row mt-3">
                            <div class="col-12">
                                <h6>维护备注</h6>
                                <p>${maintenance.notes}</p>
                            </div>
                        </div>
                    ` : ''}
                `;
                
                document.getElementById('maintenanceDetailContent').innerHTML = detailContent;
                new bootstrap.Modal(document.getElementById('maintenanceDetailModal')).show();
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showAlert('加载维护详情失败', 'danger');
        });
}

// 显示分页
function displayPagination(total, totalPages, currentPage) {
    const pagination = document.getElementById('maintenancePagination');
    pagination.innerHTML = '';
    
    if (totalPages <= 1) return;
    
    // 上一页
    if (currentPage > 1) {
        pagination.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadMaintenanceRecords(${currentPage - 1})">上一页</a></li>`;
    }
    
    // 页码
    for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
        const active = i === currentPage ? 'active' : '';
        pagination.innerHTML += `<li class="page-item ${active}"><a class="page-link" href="#" onclick="loadMaintenanceRecords(${i})">${i}</a></li>`;
    }
    
    // 下一页
    if (currentPage < totalPages) {
        pagination.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="loadMaintenanceRecords(${currentPage + 1})">下一页</a></li>`;
    }
}

// 重置表单
document.getElementById('addMaintenanceModal').addEventListener('hidden.bs.modal', function () {
    document.getElementById('maintenanceForm').reset();
    document.getElementById('maintenanceStartDate').value = new Date().toISOString().split('T')[0];
});
</script>
{% endblock %}
